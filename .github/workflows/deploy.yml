name: Build and Deploy to Pages Repo

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Deploy to pages repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          # create SPA fallback INSIDE dist (no extra step added)
          cp dist/index.html dist/404.html

          # clone target repo
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/TitanTechOrg/TitanTechOrg.github.io.git deploy-repo

          # clean old files (safe)
          find deploy-repo -mindepth 1 -maxdepth 1 \
            -not -name '.git' \
            -not -name 'CNAME' \
            -exec rm -rf {} +

          # copy new build
          cp -r dist/* deploy-repo/

          # ensure GitHub Pages compatibility
          touch deploy-repo/.nojekyll

          cd deploy-repo

          git add .

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Deploy $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:master